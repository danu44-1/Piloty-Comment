# /etc/ssh/sshd_config.d/00-hardening.conf
# Hardening Konfigurasi OpenSSH Server - Universitas Pertamina (Pekan 5)
# Rujukan: CIS Ubuntu Linux Benchmark 24.04 LTS (5.2.x)
# Mitigasi: T-02 (Brute Force / Online Guessing) & CVE-2024-6387 (regreSSHion)

# 1. Nonaktifkan otentikasi kata sandi (Hanya izinkan SSH Key)
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes

# 2. Tolak login langsung sebagai superuser (root)
PermitRootLogin no

# 3. Batasi pengguna yang diizinkan melakukan koneksi SSH
AllowUsers deploy

# 4. Batasi percobaan login gagal untuk mitigasi brute force
MaxAuthTries 3

# 5. Perkecil jendela waktu login tanpa otentikasi (Mitigasi DoS & regreSSHion)
LoginGraceTime 30

# 6. Nonaktifkan fitur X11 yang tidak diperlukan pada server headless
X11Forwarding no

# 7. Batasi akses environment variabel klien
PermitUserEnvironment no

# 8. Logging verbose untuk keperluan audit jejak siber
LogLevel VERBOSE
